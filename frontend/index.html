<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Intelligence — PFE 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>

:root {
  --primary-50:  #eff6ff;  --primary-100: #dbeafe;  --primary-200: #bfdbfe;
  --primary-300: #93c5fd;  --primary-400: #60a5fa;  --primary-500: #3b82f6;
  --primary-600: #2563eb;  --primary-700: #1d4ed8;  --primary-800: #1e40af;
  --primary-900: #1e3a8a;
  --slate-50:  #f8fafc;  --slate-100: #f1f5f9;  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;  --slate-400: #94a3b8;  --slate-500: #64748b;
  --slate-600: #475569;  --slate-700: #334155;  --slate-800: #1e293b;
  --slate-900: #0f172a;
  --success-50: #f0fdf4;  --success-500: #22c55e;  --success-600: #16a34a;
  --warning-50: #fffbeb;  --warning-500: #f59e0b;  --warning-600: #d97706;
  --error-50:   #fef2f2;  --error-500:   #ef4444;  --error-600:   #dc2626;
  --bg-primary:   #ffffff;  --bg-secondary: var(--slate-50);
  --bg-tertiary:  var(--slate-100);  --bg-sidebar:   #fafbfc;
  --bg-hover:     var(--slate-100);  --bg-active:    var(--primary-50);
  --text-primary:   var(--slate-900);  --text-secondary: var(--slate-600);
  --text-tertiary:  var(--slate-400);  --text-inverse:   #ffffff;
  --border-light:   var(--slate-200);  --border-medium:  var(--slate-300);
  --border-focus:   var(--primary-500);
  --shadow-sm:  0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md:  0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg:  0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-xl:  0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --space-1: 4px;   --space-2: 8px;   --space-3: 12px;
  --space-4: 16px;  --space-5: 20px;  --space-6: 24px;
  --space-8: 32px;  --space-10: 40px; --space-12: 48px;
  --radius-sm: 6px;   --radius-md: 8px;   --radius-lg: 12px;
  --radius-xl: 16px;  --radius-2xl: 20px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  --transition-fast:   150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow:   300ms cubic-bezier(0.4, 0, 0.2, 1);
  --sidebar-width: 280px;  --header-height: 60px;  --input-height:  56px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary:   #0f172a;  --bg-secondary: #1e293b;  --bg-tertiary:  #334155;
    --bg-sidebar:   #0f172a;  --bg-hover:     #1e293b;  --bg-active:    #1e3a8a;
    --text-primary:   #f1f5f9;  --text-secondary: #94a3b8;  --text-tertiary:  #64748b;
    --border-light:   #334155;  --border-medium:  #475569;
  }
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 15px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { font-family: var(--font-sans); background: var(--bg-secondary); color: var(--text-primary); height: 100vh; overflow: hidden; line-height: 1.5; }
.app { display: flex; height: 100vh; width: 100vw; }

.sidebar {
  width: var(--sidebar-width); min-width: var(--sidebar-width); background: var(--bg-sidebar);
  border-right: 1px solid var(--border-light); display: flex; flex-direction: column; overflow: hidden;
  transition: width var(--transition-slow), transform var(--transition-slow);
}
.sidebar.collapsed { width: 64px; min-width: 64px; }
.sidebar-header {
  height: var(--header-height); padding: 0 var(--space-4); display: flex; align-items: center; gap: var(--space-3);
  border-bottom: 1px solid var(--border-light); flex-shrink: 0;
}
.logo-icon {
  width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
  border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.logo-icon svg { width: 18px; height: 18px; stroke: white; stroke-width: 2; fill: none; }
.logo-text { font-weight: 700; font-size: 0.95rem; color: var(--text-primary); letter-spacing: -0.01em; }
.logo-text span { color: var(--text-tertiary); font-weight: 500; font-size: 0.75rem; display: block; margin-top: -2px; }
.sidebar-toggle { margin-left: auto; background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: var(--space-2); border-radius: var(--radius-md); transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; }
.sidebar-toggle:hover { background: var(--bg-hover); color: var(--text-secondary); }
.sidebar-toggle svg { width: 18px; height: 18px; }

.new-chat-btn {
  margin: var(--space-3) var(--space-4); padding: var(--space-3) var(--space-4); background: var(--primary-600); color: white; border: none;
  border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all var(--transition-fast);
  display: flex; align-items: center; justify-content: center; gap: var(--space-2); flex-shrink: 0;
}
.new-chat-btn:hover { background: var(--primary-700); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.new-chat-btn:active { transform: translateY(0); }
.new-chat-btn svg { width: 16px; height: 16px; }

.sidebar-section { padding: var(--space-3) var(--space-4); flex-shrink: 0; }
.sidebar-section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin-bottom: var(--space-2); display: flex; align-items: center; justify-content: space-between; }

.history-list { flex: 1; overflow-y: auto; padding: 0 var(--space-2); }
.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }

.history-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast); margin-bottom: 2px; position: relative; }
.history-item:hover { background: var(--bg-hover); }
.history-item.active { background: var(--bg-active); }
.history-item.active .hi-title { color: var(--primary-700); }

.hi-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.8rem; }
.history-item.active .hi-icon { background: var(--primary-100); }
.hi-content { flex: 1; min-width: 0; }
.hi-title { font-size: 0.82rem; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.hi-meta { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 1px; display: flex; align-items: center; gap: var(--space-2); }

.hi-delete { opacity: 0; background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 2px; border-radius: var(--radius-sm); transition: all var(--transition-fast); flex-shrink: 0; }
.history-item:hover .hi-delete { opacity: 1; }
.hi-delete:hover { color: var(--error-500); background: var(--error-50); }

.hi-running { width: 6px; height: 6px; background: var(--warning-500); border-radius: 50%; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; flex-shrink: 0; margin-top: 6px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.history-empty { text-align: center; padding: var(--space-10) var(--space-4); color: var(--text-tertiary); font-size: 0.85rem; }

.sidebar-footer { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-light); flex-shrink: 0; }
.user-card { display: flex; align-items: center; gap: var(--space-3); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-500), var(--primary-700)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 0.8rem; flex-shrink: 0; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
.user-role { font-size: 0.7rem; color: var(--text-tertiary); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); }

.topbar { height: var(--header-height); padding: 0 var(--space-6); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-light); background: var(--bg-primary); flex-shrink: 0; z-index: 10; }
.topbar-left { display: flex; align-items: center; gap: var(--space-4); }
.breadcrumb { display: flex; align-items: center; gap: var(--space-2); font-size: 0.85rem; color: var(--text-secondary); }
.breadcrumb-sep { color: var(--text-tertiary); }

.session-badge { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); background: var(--bg-tertiary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); font-family: var(--font-mono); }
.session-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success-500); }

.topbar-right { display: flex; align-items: center; gap: var(--space-2); }
.topbar-btn { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: none; border: 1px solid var(--border-light); border-radius: var(--radius-md); color: var(--text-secondary); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all var(--transition-fast); }
.topbar-btn:hover { background: var(--bg-hover); border-color: var(--border-medium); color: var(--text-primary); }
.topbar-btn svg { width: 16px; height: 16px; }
.topbar-btn.primary { background: var(--primary-600); color: white; border-color: var(--primary-600); }
.topbar-btn.primary:hover { background: var(--primary-700); border-color: var(--primary-700); }

.chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.messages { flex: 1; overflow-y: auto; padding: var(--space-6) var(--space-8); display: flex; flex-direction: column; gap: var(--space-5); }
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }

.message { display: flex; gap: var(--space-4); max-width: 85%; animation: messageIn var(--transition-normal); }
@keyframes messageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.assistant { align-self: flex-start; }

.message-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.85rem; }
.message.user .message-avatar { background: var(--primary-100); color: var(--primary-700); }
.message.assistant .message-avatar { background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: white; }

.message-body { padding: var(--space-4) var(--space-5); border-radius: var(--radius-xl); font-size: 0.9rem; line-height: 1.65; word-break: break-word; }
.message.user .message-body { background: var(--primary-600); color: white; border-bottom-right-radius: var(--radius-sm); }
.message.assistant .message-body { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-light); border-bottom-left-radius: var(--radius-sm); }
.message-meta { font-size: 0.7rem; color: var(--text-tertiary); margin-top: var(--space-1); padding: 0 var(--space-1); }

.message-body .answer-body h1, .message-body .answer-body h2, .message-body .answer-body h3 { font-weight: 700; color: inherit; margin: var(--space-4) 0 var(--space-2); }
.message-body .answer-body h1 { font-size: 1.1rem; }
.message-body .answer-body h2 { font-size: 1rem; }
.message-body .answer-body h3 { font-size: 0.95rem; color: var(--primary-600); }
.message-body .answer-body p { margin: var(--space-2) 0; }
.message-body .answer-body ul, .message-body .answer-body ol { margin: var(--space-2) 0 var(--space-2) var(--space-5); }
.message-body .answer-body li { margin-bottom: var(--space-1); }
.message-body .answer-body strong { font-weight: 700; }
.message-body .answer-body a { color: var(--primary-600); text-decoration: none; }
.message-body .answer-body a:hover { text-decoration: underline; }
.message-body .answer-body table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: var(--space-3) 0; }
.message-body .answer-body th { background: var(--bg-tertiary); padding: var(--space-2) var(--space-3); text-align: left; font-weight: 600; border: 1px solid var(--border-light); }
.message-body .answer-body td { padding: var(--space-2) var(--space-3); border: 1px solid var(--border-light); }
.message-body .answer-body code { background: var(--bg-tertiary); padding: 2px 5px; border-radius: var(--radius-sm); font-size: 0.85em; font-family: var(--font-mono); }
.message-body .answer-body pre { background: var(--slate-800); color: #e2e8f0; padding: var(--space-4); border-radius: var(--radius-lg); overflow-x: auto; font-size: 0.82rem; margin: var(--space-3) 0; }
.message-body .answer-body pre code { background: none; padding: 0; color: inherit; }
.message-body .answer-body blockquote { border-left: 3px solid var(--primary-300); padding-left: var(--space-3); color: var(--text-secondary); margin: var(--space-3) 0; }

.doc-card-inline { display: inline-flex; align-items: center; gap: var(--space-3); background: var(--bg-tertiary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); }
.doc-card-inline .doc-icon { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--primary-100); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.doc-card-inline .doc-icon svg { width: 18px; height: 18px; stroke: var(--primary-600); }
.doc-card-inline .doc-info { min-width: 0; }
.doc-card-inline .doc-name { font-weight: 600; font-size: 0.85rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-card-inline .doc-type { font-size: 0.72rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }

.citation-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; background: var(--primary-600); color: white; font-size: 0.68rem; font-weight: 700; border-radius: 50%; margin: 0 2px; vertical-align: super; line-height: 1; cursor: pointer; transition: all var(--transition-fast); }
.citation-badge:hover { background: var(--primary-700); transform: scale(1.15); }

.sources-section { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--border-light); }
.sources-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
.sources-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); }
.sources-count { font-size: 0.72rem; font-weight: 600; color: var(--primary-600); background: var(--primary-50); padding: 2px 8px; border-radius: var(--radius-lg); }

.source-chip { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); font-size: 0.82rem; transition: all var(--transition-fast); cursor: pointer; margin-bottom: var(--space-2); }
.source-chip:hover { border-color: var(--primary-300); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.source-chip .source-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
.source-chip.doc-source .source-num { background: var(--primary-100); color: var(--primary-700); }
.source-chip.web-source .source-num { background: var(--success-50); color: var(--success-600); }
.source-chip .source-info { flex: 1; min-width: 0; }
.source-chip .source-title { font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.source-chip .source-subtitle { font-size: 0.72rem; color: var(--text-tertiary); }
.source-chip .source-arrow { color: var(--text-tertiary); flex-shrink: 0; transition: transform var(--transition-fast); }
.source-chip:hover .source-arrow { transform: translateX(2px); color: var(--primary-500); }

.excerpt-panel { position: fixed; bottom: 100px; right: var(--space-8); z-index: 100; width: 440px; max-height: 480px; overflow-y: auto; background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); animation: panelIn var(--transition-normal); }
@keyframes panelIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.excerpt-panel-header { display: flex; align-items: flex-start; justify-content: space-between; padding: var(--space-4) var(--space-5); background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
.excerpt-panel-title { font-size: 0.88rem; font-weight: 700; color: white; }
.excerpt-panel-meta { display: flex; gap: var(--space-2); margin-top: var(--space-1); }
.excerpt-panel-meta span { font-size: 0.7rem; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: var(--radius-lg); }
.excerpt-panel-close { background: rgba(255,255,255,0.2); border: none; color: white; width: 28px; height: 28px; border-radius: var(--radius-md); cursor: pointer; font-size: 1.1rem; line-height: 1; display: flex; align-items: center; justify-content: center; transition: background var(--transition-fast); }
.excerpt-panel-close:hover { background: rgba(255,255,255,0.35); }
.excerpt-panel-body { padding: var(--space-4) var(--space-5); }
.excerpt-panel-body blockquote { border-left: 3px solid var(--primary-300); padding-left: var(--space-3); margin: 0; color: var(--text-secondary); font-size: 0.85rem; line-height: 1.8; white-space: pre-wrap; }
.excerpt-highlight { background: linear-gradient(120deg, #fef08a 0%, #fde047 100%); color: #713f12; border-radius: 2px; padding: 0 2px; font-weight: 600; }

.input-area { padding: var(--space-4) var(--space-8) var(--space-5); border-top: 1px solid var(--border-light); background: var(--bg-primary); flex-shrink: 0; }
.input-wrapper { border: 1.5px solid var(--border-light); border-radius: var(--radius-xl); padding: var(--space-3) var(--space-4); transition: all var(--transition-fast); background: var(--bg-primary); position: relative; }
.input-wrapper:focus-within { border-color: var(--primary-400); box-shadow: 0 0 0 3px var(--primary-50); }
.input-wrapper.dragover { border-color: var(--primary-500); border-style: dashed; background: var(--primary-50); }

.file-preview-list { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
.file-preview-list:empty { display: none; }
.file-preview-chip { display: inline-flex; align-items: center; gap: var(--space-2); background: var(--bg-tertiary); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: var(--space-1) var(--space-2); font-size: 0.78rem; color: var(--text-secondary); animation: chipIn var(--transition-fast); }
@keyframes chipIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.file-preview-chip .chip-icon { width: 20px; height: 20px; border-radius: var(--radius-sm); background: var(--primary-100); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.file-preview-chip .chip-icon svg { width: 12px; height: 12px; stroke: var(--primary-600); }
.file-preview-chip .chip-remove { background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 0 2px; font-size: 1rem; line-height: 1; transition: color var(--transition-fast); }
.file-preview-chip .chip-remove:hover { color: var(--error-500); }

.input-wrapper textarea { width: 100%; border: none; outline: none; resize: none; font-size: 0.92rem; line-height: 1.5; font-family: inherit; background: transparent; min-height: 24px; max-height: 140px; color: var(--text-primary); }
.input-wrapper textarea::placeholder { color: var(--text-tertiary); }

.input-actions { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--border-light); }
.input-actions-left { display: flex; align-items: center; gap: var(--space-1); }
.input-actions-right { display: flex; align-items: center; gap: var(--space-2); }

.action-btn { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-3); background: none; border: none; border-radius: var(--radius-md); color: var(--text-tertiary); font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all var(--transition-fast); }
.action-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
.action-btn svg { width: 16px; height: 16px; }
.action-btn.active { background: var(--primary-50); color: var(--primary-600); }
.action-btn.active:hover { background: var(--primary-100); }

.send-btn { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); background: var(--primary-600); color: white; border: none; border-radius: var(--radius-lg); font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all var(--transition-fast); }
.send-btn:hover:not(:disabled) { background: var(--primary-700); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.send-btn svg { width: 16px; height: 16px; }

.kbd-hint { font-size: 0.68rem; color: var(--text-tertiary); font-family: var(--font-mono); background: var(--bg-tertiary); padding: 1px 5px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: var(--space-10); text-align: center; color: var(--text-tertiary); }
.empty-state .empty-icon { width: 64px; height: 64px; border-radius: var(--radius-xl); background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-4); }
.empty-state .empty-icon svg { width: 32px; height: 32px; stroke: var(--text-tertiary); stroke-width: 1.5; fill: none; }
.empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-2); }
.empty-state p { font-size: 0.9rem; max-width: 400px; line-height: 1.6; }
.empty-state .empty-actions { display: flex; gap: var(--space-3); margin-top: var(--space-6); }
.empty-btn { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-5); background: var(--bg-primary); border: 1.5px solid var(--border-light); border-radius: var(--radius-lg); color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all var(--transition-fast); }
.empty-btn:hover { border-color: var(--primary-300); background: var(--primary-50); color: var(--primary-700); }
.empty-btn svg { width: 18px; height: 18px; }
.empty-btn.primary { background: var(--primary-600); color: white; border-color: var(--primary-600); }
.empty-btn.primary:hover { background: var(--primary-700); border-color: var(--primary-700); }

.typing-indicator { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-1) 0; }
.typing-indicator span { width: 6px; height: 6px; background: var(--text-tertiary); border-radius: 50%; animation: typingBounce 1.4s infinite ease-in-out both; }
.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
@keyframes typingBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

.toast-container { position: fixed; bottom: var(--space-6); right: var(--space-6); z-index: 1000; display: flex; flex-direction: column; gap: var(--space-3); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); font-size: 0.85rem; color: var(--text-secondary); max-width: 400px; animation: toastIn var(--transition-normal); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.toast.toast-success { border-left: 3px solid var(--success-500); }
.toast.toast-warning { border-left: 3px solid var(--warning-500); }
.toast.toast-error   { border-left: 3px solid var(--error-500); }
.toast.toast-info    { border-left: 3px solid var(--primary-500); }
.toast-icon { flex-shrink: 0; font-size: 1.1rem; }
.toast-content { flex: 1; }
.toast-title { font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.toast-close { background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 2px; border-radius: var(--radius-sm); transition: color var(--transition-fast); }
.toast-close:hover { color: var(--text-secondary); }

.guardrail-card { background: var(--warning-50); border: 1px solid #fed7aa; border-left: 3px solid var(--warning-500); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); color: #92400e; font-size: 0.9rem; line-height: 1.6; }
.guardrail-card[dir="rtl"] { border-left: none; border-right: 3px solid var(--warning-500); text-align: right; }
.guardrail-title { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); font-weight: 700; font-size: 0.95rem; color: #78350f; }
.guardrail-card[dir="rtl"] .guardrail-title { flex-direction: row-reverse; }

.answer-card { background: linear-gradient(135deg, var(--primary-50) 0%, #f0f4ff 100%); border: 1px solid var(--primary-200); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-3); }
.answer-card-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--primary-700); margin-bottom: var(--space-1); display: flex; align-items: center; gap: var(--space-1); }
.answer-card-value { font-size: 1.3rem; font-weight: 800; color: var(--primary-900); line-height: 1.25; }
.answer-card-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: var(--space-1); }

.scanned-banner { display: none; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-6); background: var(--warning-50); border-bottom: 1px solid #fed7aa; color: #92400e; font-size: 0.82rem; flex-shrink: 0; }
.scanned-banner svg { width: 16px; height: 16px; stroke: #d97706; flex-shrink: 0; }

@media (max-width: 768px) {
  .sidebar { position: fixed; z-index: 50; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .messages { padding: var(--space-4); }
  .input-area { padding: var(--space-3) var(--space-4); }
  .excerpt-panel { right: var(--space-4); width: calc(100vw - var(--space-8)); }
}

.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
input[type="file"] { display: none; }
</style>
<base target="_blank">

<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      <div class="logo-text">Doc Intelligence<span>PFE 2026</span></div>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Collapse sidebar">

  <main class="main">
    <header class="topbar">

        </div>
        <div class="session-badge hidden" id="sessionBadge">
          <span class="dot"></span><span id="sessionIdDisplay">—</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" onclick="document.getElementById('fileInput').click()" title="Upload document (Ctrl+U)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

        <button class="topbar-btn" onclick="clearChat()" title="Clear conversation">

      Scanned document detected — OCR is running in the background.

    <div class="chat-area">

      <div class="input-area">
        <div class="input-wrapper" id="inputWrapper">
          <div class="file-preview-list" id="filePreviewList"></div>
          <textarea id="messageInput" rows="1" placeholder="Ask a question, or drag & drop a document here..." disabled></textarea>
          <div class="input-actions">

              <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="Attach document">

                Attach
              </button>
              <button class="action-btn" id="deepResearchBtn" onclick="toggleDeepResearch()" title="Toggle Deep Research (Ctrl+D)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                <span id="deepResearchLabel">Deep Research</span>

<div class="toast-container" id="toastContainer"></div>
<input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.html,.htm,.png,.jpg,.jpeg,.gif,.bmp,.tiff,.webp">

<script>

marked.setOptions({ breaks: true, gfm: true });
marked.use({ renderer: { html: function() { return ''; } } });

const API_BASE = window.location.hostname === 'localhost' ? 'http://127.0.0.1:8000/api/v1' : (window.API_BASE_URL || '/api');

let sessionId = null;
let attachedFiles = [];
let isProcessing = false;
let isDeepResearchMode = false;
let currentDocId = null;
const backgroundTasks = {};
const _sourceRegistry = {};

const fileInput = document.getElementById('fileInput');
const messages = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const inputWrapper = document.getElementById('inputWrapper');
const filePreviewList = document.getElementById('filePreviewList');
const sessionBadge = document.getElementById('sessionBadge');
const sessionIdDisp = document.getElementById('sessionIdDisplay');
const scannedBanner = document.getElementById('scannedBanner');
const historyList = document.getElementById('historyList');
const historyCount = document.getElementById('historyCount');
const breadcrumbCurrent = document.getElementById('breadcrumbCurrent');
const toastContainer = document.getElementById('toastContainer');

function saveSessionState() {
  if (!sessionId) return;
  localStorage.setItem('active_session_id', sessionId);
  const url = new URL(window.location);
  url.searchParams.set('session', sessionId);
  window.history.replaceState({}, '', url);
}

function restoreSessionState() {
  const p = new URLSearchParams(window.location.search);
  return p.get('session') || localStorage.getItem('active_session_id') || null;
}

function clearSessionState() {
  localStorage.removeItem('active_session_id');
  const url = new URL(window.location);
  url.searchParams.delete('session');
  window.history.replaceState({}, '', url);
}

function savePendingSources(sid, answerText, sources) {
  if (!sid || !sources || !sources.length) return;
  try {
    const key = 'pfe_sources_' + sid;
    const prev = JSON.parse(localStorage.getItem(key) || '[]');
    const fp = (answerText || '').slice(0, 120);
    if (!prev.some(function(e) { return e.fp === fp; })) {
      prev.push({ fp: fp, sources: sources });
      localStorage.setItem(key, JSON.stringify(prev));
    }
  } catch (e) {}
}

function lookupCachedSources(sid, answerText) {
  if (!sid || !answerText) return [];
  try {
    const cache = JSON.parse(localStorage.getItem('pfe_sources_' + sid) || '[]');
    const fp = (answerText || '').slice(0, 120);
    const entry = cache.find(function(e) { return e.fp === fp; });
    return entry ? entry.sources : [];
  } catch { return []; }
}

function clearCachedSources(sid) {
  if (sid) localStorage.removeItem('pfe_sources_' + sid);
}

function showToast(title, message, type, duration) {
  type = type || 'info';
  duration = duration || 5000;
  const toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  const icons = { success: '✅', warning: '⚠️', error: '❌', info: 'ℹ️' };
  toast.innerHTML = '<span class="toast-icon">' + icons[type] + '</span><div class="toast-content"><div class="toast-title">' + escHtml(title) + '</div><div>' + escHtml(message) + '</div></div><button class="toast-close" onclick="this.parentElement.remove()">×</button>';
  toastContainer.appendChild(toast);
  if (duration > 0) setTimeout(function() { toast.remove(); }, duration);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'message assistant';
  d.id = 'typing';
  d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function clearMessages() {
  messages.innerHTML = '';
}

function showEmptyState() {
  messages.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  empty.innerHTML = '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></div><h3>Start a conversation</h3><p>Upload a business document or ask a question to get started. The assistant supports invoices, contracts, reports, and more.</p>';

  const actions = document.createElement('div');
  actions.className = 'empty-actions';

  const btnUpload = document.createElement('button');
  btnUpload.className = 'empty-btn primary';
  btnUpload.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload Document';
  btnUpload.onclick = function() { document.getElementById('fileInput').click(); };

  const btnResearch = document.createElement('button');
  btnResearch.className = 'empty-btn';
  btnResearch.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>Deep Research';
  btnResearch.onclick = toggleDeepResearch;

  actions.appendChild(btnUpload);
  actions.appendChild(btnResearch);
  empty.appendChild(actions);
  messages.appendChild(empty);
}

function escHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function formatBytes(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderFilePreviewList() {
  filePreviewList.innerHTML = '';
  const pendingFiles = attachedFiles.filter(function(f) { return !f.uploaded; });
  pendingFiles.forEach(function(f) {
    const chip = document.createElement('div');
    chip.className = 'file-preview-chip';
    chip.innerHTML = '<div class="chip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><span>' + escHtml(f.name) + '</span><button class="chip-remove" onclick="removeAttachedFile(' + attachedFiles.indexOf(f) + ')" title="Remove">×</button>';
    filePreviewList.appendChild(chip);
  });
}

function removeAttachedFile(i) {
  attachedFiles.splice(i, 1);
  renderFilePreviewList();
  if (!attachedFiles.length && !sessionId) {
    messageInput.disabled = true;
    sendBtn.disabled = true;
    showEmptyState();
  }
}

function highlightTermsInText(text, terms) {
  if (!terms || !terms.length) return escHtml(text);
  const escaped = terms.map(function(t) { return (t || '').trim(); })
    .filter(function(t) { return t.length > 1; })
    .map(function(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
  if (!escaped.length) return escHtml(text);
  const pattern = new RegExp('(' + escaped.join('|') + ')', 'gi');
  return text.split(pattern).map(function(part, i) {
    return i % 2 === 1 ? '<mark class="excerpt-highlight">' + escHtml(part) + '</mark>' : escHtml(part);
  }).join('');
}

function extractHighlightTerms(answerText) {
    if (!answerText) return [];
    const terms = new Set();
    const nums = answerText.match(/\b\d[\d\s.,]*\d\b|\b\d+\b/g) || [];
    nums.forEach(function(n) { terms.add(n.replace(/\s/g, '')); terms.add(n); });
    const units = answerText.match(/\b(dinars?|millimes?|TND|DT|EUR|USD|TTC|HT|TVA|total|montant|prix|مبلغ|دينار|مليم)\b/gi) || [];
    units.forEach(function(u) { terms.add(u); });
    const caps = answerText.match(/\b[A-ZÀ-Ü][a-zà-ü]{2,}\b/g) || [];
    caps.forEach(function(c) { terms.add(c); });
    return Array.from(terms).filter(function(t) { return t.length > 1; });
    }

function showExcerptPanel(src, answerText) {
    const existing = document.getElementById('excerpt-panel');
    if (existing) existing.remove();
    const text = src.excerpt || src.content || '';
    if (!text) return;
    const terms = extractHighlightTerms(answerText || '');
    const highlighted = highlightTermsInText(text, terms);
    const hasHL = terms.length > 0 && text.toLowerCase() !== highlighted.toLowerCase();
    const scoreHTML = src.score ? '<span>Score: ' + (src.score * 100).toFixed(0) + '%</span>' : '';
    const pageHTML = src.page ? '<span>Page ' + escHtml(String(src.page)) + '</span>' : '';
    const panel = document.createElement('div');
    panel.id = 'excerpt-panel';
    panel.className = 'excerpt-panel';
    panel.innerHTML = '<div class="excerpt-panel-header"><div style="flex:1;min-width:0;"><div class="excerpt-panel-title">📄 ' + escHtml(src.title) + '</div><div class="excerpt-panel-meta">' + pageHTML + scoreHTML + '</div></div><button class="excerpt-panel-close" onclick="document.getElementById(\'excerpt-panel\').remove()">&times;</button></div><div class="excerpt-panel-body">' + (hasHL ? '<div style="font-size:0.72rem;color:var(--text-tertiary);margin-bottom:10px;display:flex;align-items:center;gap:5px;">✨ Highlighted text shows where the answer was found</div>' : '') + '<blockquote>' + highlighted + '</blockquote></div>';
    document.body.appendChild(panel);
    requestAnimationFrame(function() {
        const first = panel.querySelector('.excerpt-highlight');
        if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
    setTimeout(function() {
        function closePanel(e) { if (!panel.contains(e.target)) { panel.remove(); document.removeEventListener('click', closePanel); } }
        document.addEventListener('click', closePanel);
    }, 100);
    }

function showExcerptById(renderKey, sourceId) {
    const srcs = _sourceRegistry[renderKey];
    if (!srcs) return;
    const src = srcs.find(function(s) { return s.id === sourceId; });
    const answerText = _sourceRegistry[renderKey + '_answer'] || '';
    if (src) showExcerptPanel(src, answerText);
    }

function addDocumentCard(fileName, beforeElement) {
    const ext = fileName.split('.').pop().toUpperCase();
    const d = document.createElement('div');
    d.className = 'message user';
    d.innerHTML = '<div class="message-avatar">U</div><div class="message-body"><div class="doc-card-inline"><div class="doc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="doc-info"><div class="doc-name">' + escHtml(fileName) + '</div><div class="doc-type">' + ext + ' Document</div></div></div></div>';
    if (beforeElement && beforeElement.parentNode) {
        messages.insertBefore(d, beforeElement);
    } else {
        messages.appendChild(d);
    }
    messages.scrollTop = messages.scrollHeight;
    return d;
    }

inputWrapper.addEventListener('dragover', function(e) { e.preventDefault(); inputWrapper.classList.add('dragover'); });
inputWrapper.addEventListener('dragleave', function() { inputWrapper.classList.remove('dragover'); });
inputWrapper.addEventListener('drop', function(e) { e.preventDefault(); inputWrapper.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', function(e) { if (e.target.files.length) handleFiles(e.target.files); });

function handleFiles(fileList) {
  const valid = ['.pdf','.docx','.xlsx','.html','.htm','.png','.jpg','.jpeg','.gif','.bmp','.tiff','.webp'];
  for (let i = 0; i < fileList.length; i++) {
    const file = fileList[i];
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (valid.indexOf(ext) === -1) { showToast('Unsupported file', 'Cannot upload ' + file.name, 'warning'); continue; }
    attachedFiles.push({ name: file.name, file: file, uploaded: false, doc_id: null });
  }
  renderFilePreviewList();
  messageInput.disabled = false;
  sendBtn.disabled = false;
  messageInput.focus();
  if (!sessionId && attachedFiles.length === 1) {
    clearMessages();
    addMessage('Type a question and press Send, or press Send with an empty input to get a brief summary.', 'assistant');
  }
}

let _lastText = null;
let _lastTime = 0;

async function sendMessage() {
  const text = messageInput.value.trim();
  if (isProcessing) return;
  const now = Date.now();
  if (text === _lastText && now - _lastTime < 3000) return;

  if (isDeepResearchMode) {
    if (!text) { showToast('Research question required', 'Please type a research question first.', 'warning'); return; }
    const pending = attachedFiles.filter(function(f) { return !f.uploaded; });
    let msgAdded = false;
    if (pending.length) {
      for (let i = 0; i < pending.length; i++) addDocumentCard(pending[i].name);
      addMessage(text, 'user');
      msgAdded = true;
      filePreviewList.innerHTML = '';
      for (let i = 0; i < pending.length; i++) {
        await uploadFile(pending[i].file, null, 'deep_research');
        pending[i].uploaded = true;
      }
      attachedFiles = attachedFiles.filter(function(f) { return !f.uploaded; });
      renderFilePreviewList();
    }
    _lastText = text;
    _lastTime = now;
    await sendDeepResearch(text, msgAdded);
    return;
  }

  if (!text && !attachedFiles.length) { showToast('Input required', 'Please type a question or attach a document.', 'warning'); return; }

  const pending = attachedFiles.filter(function(f) { return !f.uploaded; });
  if (text && !pending.length) { addMessage(text, 'user'); _lastText = text; _lastTime = now; }
  messageInput.value = '';
  messageInput.style.height = 'auto';

  if (pending.length) {
    for (let i = 0; i < pending.length; i++) addDocumentCard(pending[i].name);
    if (text) addMessage(text, 'user');
    filePreviewList.innerHTML = '';
    for (let i = 0; i < pending.length; i++) {
      await uploadFile(pending[i].file, text && pending[i] === pending[pending.length - 1] ? text : null);
      pending[i].uploaded = true;
    }
    attachedFiles = attachedFiles.filter(function(f) { return !f.uploaded; });
    renderFilePreviewList();
    if (text && pending[pending.length - 1]) return;
  }
  if (sessionId && text) await askStreaming(text, sessionId);
}

async function uploadFile(file, prompt, source) {
  source = source || null;
  isProcessing = true;
  sendBtn.disabled = true;
  messageInput.disabled = true;
  const isSilent = source === 'deep_research' && !prompt;
  if (!isSilent) showTyping();
  const fd = new FormData();
  fd.append('file', file);
  fd.append('mode', 'brief');
  fd.append('index', 'true');
  if (prompt) fd.append('prompt', prompt);
  if (sessionId) fd.append('session_id', sessionId);
  if (source) fd.append('source', source);
  try {
    const res = await fetch(API_BASE + '/documents/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!isSilent) hideTyping();
    if (!res.ok) throw new Error(data.detail || 'Upload failed');
    const rid = data.doc_id || data.document_id;
    if (rid) {
      const e = attachedFiles.find(function(f) { return f.name === file.name; });
      if (e) e.doc_id = rid;
    }
    const isNew = !sessionId;
    sessionId = data.session_id;
    saveSessionState();
    if (data.doc_id) currentDocId = data.doc_id;
    sessionBadge.classList.remove('hidden');
    sessionIdDisp.textContent = sessionId.slice(0, 8) + '...';
    breadcrumbCurrent.textContent = isNew ? 'Active Conversation' : breadcrumbCurrent.textContent;
    if (data.scanned_note) scannedBanner.style.display = 'flex';
    if (!isSilent) {
      if (data.status === 'answered') {
        const src = data.sources || [];
        addMessage(data.answer, 'assistant', false, src);
        savePendingSources(sessionId, data.answer, src);
      } else if (data.status === 'summarized') {
        addMessage(data.summary || data.message, 'assistant', true);
      }
    }
    if (isNew) loadHistory();
  } catch (err) {
    if (!isSilent) hideTyping();
    addMessage(err.message.includes('429') ? 'API quota reached. Wait ~40s and try again.' : 'Error: ' + err.message, 'assistant');
    showToast('Upload failed', err.message, 'error');
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    messageInput.disabled = false;
    messageInput.focus();
    fileInput.value = '';
  }
}

async function askStreaming(question, sid) {
  isProcessing = true;
  sendBtn.disabled = true;
  const bubble = document.createElement('div');
  bubble.className = 'message assistant';
  messages.appendChild(bubble);
  messages.scrollTop = messages.scrollHeight;
  const fd = new FormData();
  fd.append('question', question);
  fd.append('session_id', sid);
  let sources = [];
  let fullText = '';
  try {
    const res = await fetch(API_BASE + '/chat/ask/stream', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('Stream failed');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (let i = 0; i < parts.length; i++) {
        let dl = '';
        const lines = parts[i].split('\n');
        for (let j = 0; j < lines.length; j++) {
          if (lines[j].startsWith('data: ')) dl = lines[j].slice(6).trim();
        }
        if (!dl) continue;
        try {
          const ev = JSON.parse(dl);
          if (ev.sources !== undefined) { sources = ev.sources || []; }
          else if (ev.token !== undefined) {
            fullText += ev.token;
            bubble.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div class="answer-body">' + marked.parse(fullText) + '<span style="display:inline-block;animation:blink 0.7s step-end infinite;color:var(--primary-500);margin-left:2px">▍</span></div></div>';
            messages.scrollTop = messages.scrollHeight;
          }
          else if (ev.done) { finishBubble(bubble, fullText, sources); loadHistory(); saveSessionState(); }
          else if (ev.error) throw new Error(ev.error);
        } catch (e) {}
      }
    }
    if (!bubble.classList.contains('done')) { finishBubble(bubble, fullText, sources); saveSessionState(); }
  } catch (err) {
    bubble.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div style="color:var(--error-500)">Error: ' + escHtml(err.message) + '</div></div>';
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    messageInput.focus();
  }
}

function finishBubble(bubble, text, sources) {
  bubble.classList.add('done');
  bubble.innerHTML = '<div class="message-avatar">AI</div><div class="message-body">' + formatAnswerWithSources(text, sources) + '</div>';
  messages.scrollTop = messages.scrollHeight;
  if (sessionId && sources && sources.length) savePendingSources(sessionId, text, sources);
}

function normalizeSources(raw) {
  return (raw || []).map(function(s, i) {
    const isWeb = !!(s.url || s.type === 'web');
    const id = s.id !== undefined ? s.id : (i + 1);
    let title = s.title || s.name || s.file_name || s.file || '';
    if (!title && isWeb && s.url) {
      try { title = new URL(s.url).hostname; } catch(e) { title = s.url; }
    }
    if (!title) title = 'Source ' + id;
    let subtitle = '';
    if (isWeb) {
      try { subtitle = new URL(s.url).hostname; } catch(e) { subtitle = s.url || ''; }
    } else if (s.page) subtitle = 'Page ' + s.page;
    else if (s.subtitle) subtitle = s.subtitle;
    return {
      id: id, title: title, subtitle: subtitle, url: s.url || '',
      content: s.content || s.chunk || '', excerpt: s.excerpt || s.content || s.chunk || '',
      page: s.page || null, score: s.score || null, doc_id: s.doc_id || '',
      chunk_index: s.chunk_index !== undefined ? s.chunk_index : null,
      file: s.file_name || s.file || '', type: isWeb ? 'web' : 'document'
    };
  });
}

function deduplicateSources(sources) {
  const idRemap = {};
  const merged = [];
  const fileMap = {};
  sources.forEach(function(src) {
    if (src.type === 'web') {
      const key = src.url || src.title;
      if (fileMap[key] !== undefined) {
        idRemap[src.id] = merged[fileMap[key]].id;
      } else {
        const newId = merged.length + 1;
        idRemap[src.id] = newId;
        fileMap[key] = merged.length;
        merged.push(Object.assign({}, src, { id: newId }));
      }
    } else {
      const key = src.file || src.title;
      if (fileMap[key] !== undefined) {
        const existing = merged[fileMap[key]];
        idRemap[src.id] = existing.id;
        if (src.excerpt && src.excerpt !== existing.excerpt) {
          existing.excerpt = existing.excerpt ? existing.excerpt + '\n\n---\n\n' + src.excerpt : src.excerpt;
          existing.content = existing.excerpt;
        }
        if (src.score && (!existing.score || src.score > existing.score)) existing.score = src.score;
        if (src.page && !existing._pages.includes(src.page)) {
          existing._pages.push(src.page);
          existing.subtitle = 'Pages ' + existing._pages.join(', ');
        }
      } else {
        const newId = merged.length + 1;
        idRemap[src.id] = newId;
        fileMap[key] = merged.length;
        merged.push(Object.assign({}, src, { id: newId, _pages: src.page ? [src.page] : [] }));
      }
    }
  });
  return { dedupedSources: merged, idRemap: idRemap };
}

function formatAnswerWithSources(text, rawSources) {
  text = (text || '').replace(/\[Excerpt\s+[\d,\s]+\]/g, '').trim();
  const normalized = normalizeSources(rawSources);
  const result = deduplicateSources(normalized);
  const sources = result.dedupedSources;
  const idRemap = result.idRemap;
  const rk = 'rk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  _sourceRegistry[rk] = sources;
  _sourceRegistry[rk + '_answer'] = text;
  const idMap = {};
  sources.forEach(function(s) { idMap[s.id] = s; });
  let html = marked.parse(text);
  html = html.replace(/(\[\d+\])(\[\d+\])+/g, function(m) {
    const nums = Array.from(m.matchAll(/\[(\d+)\]/g)).map(function(x) { return x[1]; });
    return '[' + nums.join(',') + ']';
  });
  html = html.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, function(_, numsStr) {
    const seen = new Set();
    return numsStr.split(',').map(function(n) {
      const origId = parseInt(n.trim());
      const newId = idRemap[origId] !== undefined ? idRemap[origId] : origId;
      if (seen.has(newId)) return '';
      seen.add(newId);
      const src = idMap[newId];
      if (!src) return '<sup class="citation-badge">' + newId + '</sup>';
      const hasEx = src.type === 'document' && !!(src.excerpt || src.content);
      const onclick = hasEx ? ('onclick="showExcerptById(\'' + rk + '\',' + newId + ')"') : (src.url ? ('onclick="window.open(\'' + escHtml(src.url) + '\', \'_blank\')"') : '');
      const cursor = hasEx || src.url ? 'cursor:pointer;' : '';
      return '<sup class="citation-badge citation-link" ' + onclick + ' style="' + cursor + '" title="' + escHtml(src.title) + '">' + newId + '</sup>';
    }).join('');
  });
  const answerCard = buildAnswerCard(text);
  if (!sources.length) return answerCard + '<div class="answer-body" data-rk="' + rk + '">' + (answerCard ? '' : html) + '</div>';
  const docSrcs = sources.filter(function(s) { return s.type === 'document'; });
  const webSrcs = sources.filter(function(s) { return s.type === 'web'; });
  let chips = '';
  if (docSrcs.length) {
    chips += '<div class="sources-section-label">📄 Documents</div>';
    docSrcs.forEach(function(s) { chips += buildSourceChip(s, rk); });
  }
  if (webSrcs.length) {
    chips += '<div class="sources-section-label">🌐 Web</div>';
    webSrcs.forEach(function(s) { chips += buildSourceChip(s, rk); });
  }
  return answerCard + (answerCard ? '' : '<div class="answer-body" data-rk="' + rk + '">' + html + '</div>') + '<details class="sources-collapsible" open><summary><div class="sources-header"><span class="sources-title">📚 Sources</span><span class="sources-count">' + sources.length + '</span></div></summary><div class="sources-box" data-rk="' + rk + '">' + chips + '</div></details>';
}

function buildAnswerCard(text) {
  if (!text) return '';
  const clean = text.trim();
  if (clean.length > 220 || clean.split('\n').length > 3) return '';
  const moneyMatch = clean.match(/(\d[\d\s.,]*\d|\d+)\s*(dinars?|millimes?|TND|DT|EUR|USD|€|\$|£)/i);
  const numMatch = clean.match(/^[\d\s.,]+$/);
  const dateMatch = clean.match(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b/);
  let icon = '', label = 'Answer', value = clean, sub = '';
  if (moneyMatch) { icon = '💰'; label = 'Amount'; sub = clean.replace(moneyMatch[0], '').replace(/^[:\s–-]+|[:\s–-]+$/g, '').trim(); value = moneyMatch[0].trim(); }
  else if (numMatch) { icon = '🔢'; label = 'Value'; value = clean; }
  else if (dateMatch) { icon = '📅'; label = 'Date'; value = dateMatch[0]; sub = clean.replace(dateMatch[0], '').replace(/^[:\s–-]+|[:\s–-]+$/g, '').trim(); }
  else return '';
  return '<div class="answer-card"><div class="answer-card-label">' + icon + ' ' + label + '</div><div class="answer-card-value">' + escHtml(value) + '</div>' + (sub ? '<div class="answer-card-sub">' + escHtml(sub) + '</div>' : '') + '</div>';
}

function buildSourceChip(src, rk) {
  const isWeb = src.type === 'web';
  let domain = '';
  if (isWeb && src.url) { try { domain = new URL(src.url).hostname; } catch(e) { domain = ''; } }
  const favicon = isWeb && domain ? 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=64' : '';
  const fallback = isWeb ? (domain.charAt(0) || 'W').toUpperCase() : (src.file || src.title || 'S').charAt(0).toUpperCase();
  const hasEx = !isWeb && !!(src.excerpt || src.content);
  const iconHtml = isWeb
    ? ('<img class="source-favicon" src="' + favicon + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" style="width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#f3f4f6;border:1px solid #e5e7eb;"><div class="source-favicon-fallback" style="display:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary-500),var(--primary-700));color:white;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;">' + fallback + '</div>')
    : ('<div class="source-favicon-fallback" style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary-500),var(--primary-700));color:white;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;">' + fallback + '</div>');
  const onclick = isWeb ? (src.url ? ('onclick="window.open(\'' + escHtml(src.url) + '\', \'_blank\')"') : '') : (hasEx ? ('onclick="showExcerptById(\'' + rk + '\',' + src.id + ')"') : '');
  const cursor = (isWeb && src.url) || hasEx ? 'cursor:pointer;' : '';
  const badge = isWeb ? 'background:var(--success-50);color:var(--success-600);' : 'background:var(--primary-100);color:var(--primary-700);';
  const arrow = isWeb && src.url ? '<div class="source-arrow" style="color:var(--text-tertiary);flex-shrink:0;transition:transform var(--transition-fast);">→</div>' : (hasEx ? '<div class="source-arrow" style="color:var(--primary-300);flex-shrink:0;transition:transform var(--transition-fast);">📖</div>' : '');
  return '<div class="source-chip ' + (isWeb ? 'web-source' : 'doc-source') + '" ' + onclick + ' style="' + cursor + '"><span class="source-num" style="' + badge + '">' + src.id + '</span>' + iconHtml + '<div class="source-info"><div class="source-title">' + escHtml(src.title) + '</div><div class="source-subtitle">' + escHtml(src.subtitle) + '</div></div>' + arrow + '</div>';
}

function addMessage(text, sender, isSummary, sources) {
  isSummary = isSummary || false;
  sources = sources || null;
  const d = document.createElement('div');
  d.className = 'message ' + sender;
  if (sender === 'user') {
    d.innerHTML = '<div class="message-avatar">U</div><div class="message-body">' + escHtml(text) + '</div>';
  } else if (isSummary) {
    if (sources && sources.length) {
      d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body">' + formatAnswerWithSources(text, sources) + '</div>';
      if (!d.innerHTML.includes('summary-box')) {
        d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div class="summary-box" style="background:white;border-left:4px solid var(--primary-600);padding:12px 14px;border-radius:8px;"><h3 style="color:var(--primary-600);margin-bottom:8px;font-size:0.88rem;">📄 Document Brief</h3><div class="answer-body">' + marked.parse(text || '') + '</div></div><p style="margin-top:8px;font-size:0.88rem;color:var(--text-secondary);">How can I help you with this document?</p></div>';
      }
    } else {
      d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div class="summary-box" style="background:white;border-left:4px solid var(--primary-600);padding:12px 14px;border-radius:8px;"><h3 style="color:var(--primary-600);margin-bottom:8px;font-size:0.88rem;">📄 Document Brief</h3><div class="answer-body">' + marked.parse(text || '') + '</div></div><p style="margin-top:8px;font-size:0.88rem;color:var(--text-secondary);">How can I help you with this document?</p></div>';
    }
  } else if (sources && sources.length) {
    d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body">' + formatAnswerWithSources(text, sources) + '</div>';
  } else {
    d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div class="answer-body">' + marked.parse(text || '') + '</div></div>';
  }
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
  return d;
}

function toggleDeepResearch() {
  isDeepResearchMode = !isDeepResearchMode;
  const btn = document.getElementById('deepResearchBtn');
  const lbl = document.getElementById('deepResearchLabel');
  if (isDeepResearchMode) {
    btn.classList.add('active');
    lbl.textContent = 'Deep Research ON';
    messageInput.placeholder = '🔬 Type your research question...';
    messageInput.disabled = false;
    sendBtn.disabled = false;
    messageInput.focus();
  } else {
    btn.classList.remove('active');
    lbl.textContent = 'Deep Research';
    messageInput.placeholder = sessionId ? 'Ask a follow-up question...' : 'Ask a question, or drag & drop a document here...';
    if (!sessionId && !attachedFiles.length) { messageInput.disabled = true; sendBtn.disabled = true; }
  }
}

async function sendDeepResearch(text, msgAdded) {
  msgAdded = msgAdded || false;
  if (isProcessing) return;
  if (!msgAdded) addMessage(text, 'user');
  messageInput.value = '';
  messageInput.style.height = 'auto';
  isProcessing = true;
  sendBtn.disabled = true;
  messageInput.disabled = true;
  const bubble = createResearchBubble('🔬 Submitting research task...');
  const ownerSid = sessionId;
  const docIds = attachedFiles.filter(function(f) { return f.uploaded && f.doc_id; }).map(function(f) { return f.doc_id; });
  try {
    const res = await fetch(API_BASE + '/research/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, session_id: sessionId, language: 'auto', session_has_documents: docIds.length > 0, doc_id: docIds[0] || null, doc_ids: docIds })
    });
    if (!res.ok) throw new Error('Submit failed: ' + res.status);
    const data = await res.json();
    if (!data.task_id) throw new Error('No task_id returned');
    startBackgroundPoller(data.task_id, ownerSid, text, bubble);
  } catch (err) {
    bubble.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div style="color:var(--error-500)">🔬 Research error: ' + escHtml(err.message) + '</div></div>';
    isProcessing = false;
    sendBtn.disabled = false;
    messageInput.disabled = false;
    messageInput.focus();
  }
}

function createResearchBubble(msg) {
  const b = document.createElement('div');
  b.className = 'message assistant research-bubble';
  b.innerHTML = researchStatusHTML(msg);
  messages.appendChild(b);
  messages.scrollTop = messages.scrollHeight;
  return b;
}

function researchStatusHTML(msg) {
  return '<div class="message-avatar">AI</div><div class="message-body"><div class="typing-indicator"><span></span><span></span><span></span></div><div style="font-size:0.82rem;color:var(--text-secondary);margin-top:6px;">' + escHtml(msg) + '</div></div>';
}

function startBackgroundPoller(task_id, ownerSid, question, liveBubble) {
  backgroundTasks[task_id] = { task_id: task_id, ownerSessionId: ownerSid, question: question, bubble: liveBubble, done: false, result: null };
  const task = backgroundTasks[task_id];
  const iv = setInterval(async function() {
    try {
      const res = await fetch(API_BASE + '/research/status/' + task_id);
      if (!res.ok) throw new Error('Status ' + res.status);
      const result = await res.json();
      task.result = result;
      if (result.status === 'pending') updateBubbleIfVisible(task, researchStatusHTML('⏳ Queued...'));
      else if (result.status === 'running') updateBubbleIfVisible(task, researchStatusHTML('🔍 ' + (result.message || 'Researching...')));
      else if (result.status === 'done' || result.status === 'error') {
        clearInterval(iv);
        task.done = true;
        const rsid = result.session_id || ownerSid;
        if (rsid && !sessionId) {
          sessionId = rsid;
          sessionBadge.classList.remove('hidden');
          sessionIdDisp.textContent = sessionId.slice(0, 8) + '...';
          saveSessionState();
        }
        if (task.bubble && document.body.contains(task.bubble)) {
          renderResearchResult(task.bubble, result);
          messages.scrollTop = messages.scrollHeight;
        } else {
          showBgToast(task_id, question, rsid, result.status);
        }
        if (result.status === 'done' && result.sources && result.sources.length) {
          try {
            await fetch(API_BASE + '/research/session/' + (rsid || ownerSid) + '/save-sources', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sources: result.sources, answer: result.answer })
            });
          } catch(e) {}
        }
        loadHistory();
        setTimeout(function() { delete backgroundTasks[task_id]; }, 30000);
        isProcessing = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
        highlightActiveSession(sessionId);
      }
    } catch (err) {
      clearInterval(iv);
      task.done = true;
      updateBubbleIfVisible(task, '<div class="message-avatar">AI</div><div class="message-body"><div style="color:var(--error-500)">🔬 Poll error: ' + escHtml(err.message) + '</div></div>');
      isProcessing = false;
      sendBtn.disabled = false;
    }
  }, 3000);
  backgroundTasks[task_id].intervalId = iv;
  isProcessing = false;
  sendBtn.disabled = false;
  messageInput.disabled = false;
  messageInput.focus();
}

function updateBubbleIfVisible(task, html) {
  if (task.bubble && document.body.contains(task.bubble)) {
    task.bubble.innerHTML = html;
    messages.scrollTop = messages.scrollHeight;
  }
}

function isGuardrailMessage(text) {
  const t = (text || '').toLowerCase();
  const isRejection = (
    t.includes('specialized in business documents') ||
    t.includes('spécialisé dans les documents') ||
    t.includes('spécialisé dans les documents professionnels') ||
    t.includes('spécialisé dans les documents commerciaux') ||
    t.includes('cannot help') ||
    t.includes('ne peux pas répondre') ||
    t.includes('ne peux pas vous aider') ||
    t.includes('ne peux pas aider') ||
    t.includes('لا أستطيع') ||
    t.includes('je suis spécialisé') ||
    t.includes('i am specialized') ||
    t.includes('off-topic') ||
    t.includes('hors sujet')
  );
  const isNormalAnswer = (
    t.includes('le document est') ||
    t.includes('le document présente') ||
    t.includes('le montant') ||
    t.includes('la facture') ||
    t.includes('le contrat') ||
    t.includes('le rapport') ||
    t.includes('le devis') ||
    t.includes('voici un résumé') ||
    t.includes('voici un bref résumé') ||
    t.includes('document brief') ||
    t.includes('points principaux') ||
    t.includes('conclusions clés')
  );
  return isRejection && !isNormalAnswer;
}

function detectGuardrailLanguage(text) {
  if ((text || '').includes('spécialisé')) return 'fr';
  if ((text || '').includes('متخصص')) return 'ar';
  return 'en';
}

function getLocalizedGuardrail(lang) {
  const map = {
    en: 'I am specialized in business documents (invoices, contracts, reports, agreements, financial statements). Please upload a business document or ask a question related to your documents.',
    fr: 'Je suis spécialisé dans les documents professionnels (factures, contrats, rapports, devis, états financiers). Veuillez télécharger un document professionnel ou poser une question relative à vos documents.',
    ar: 'أنا متخصص في الوثائق التجارية فقط (الفواتير، العقود، التقارير، عروض الأسعار، القوائم المالية). لا أستطيع الإجابة على هذا السؤال.'
  };
  return map[lang] || 'I am specialized in business documents only.';
}

function getGuardrailTitle(lang) {
  const map = { en: 'Off-topic question detected', fr: 'Question hors sujet détectée', ar: 'تم اكتشاف سؤال خارج الموضوع' };
  return map[lang] || 'Off-topic';
}

function renderGuardrailCard(lang) {
  const isRTL = lang === 'ar';
  return '<div class="guardrail-card" dir="' + (isRTL ? 'rtl' : 'ltr') + '" style="' + (isRTL ? 'border-left:none;border-right:3px solid var(--warning-500);text-align:right;' : '') + '"><div class="guardrail-title"><span>🛡️</span><span>' + escHtml(getGuardrailTitle(lang)) + '</span></div><div class="guardrail-body">' + escHtml(getLocalizedGuardrail(lang)) + '</div></div>';
}

function renderGuardrailMessage(container, lang) {
  const d = document.createElement('div');
  d.className = 'message assistant';
  d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body">' + renderGuardrailCard(lang) + '</div>';
  container.appendChild(d);
  container.scrollTop = container.scrollHeight;
  return d;
}

function renderResearchResult(bubble, result) {
  if (!bubble || !document.body.contains(bubble)) return;
  const text = result.answer || '';
  const sources = result.sources || [];
  if (isGuardrailMessage(text)) {
    bubble.innerHTML = '<div class="message-avatar">AI</div><div class="message-body">' + renderGuardrailCard(detectGuardrailLanguage(text)) + '</div>';
  } else if (result.status === 'error') {
    bubble.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div style="color:var(--error-500)">🔬 Research error: ' + escHtml(text) + '</div></div>';
  } else {
    bubble.innerHTML = '<div class="message-avatar">AI</div><div class="message-body">' + formatAnswerWithSources(text, sources) + '</div>';
    if (sessionId && sources.length) savePendingSources(sessionId, text, sources);
  }
  bubble.classList.add('done');
}

function showBgToast(task_id, question, sid, status) {
  const t = document.createElement('div');
  t.className = 'bg-task-toast';
  const q = question.length > 50 ? question.slice(0, 47) + '...' : question;
  t.innerHTML = '<span>' + (status === 'done' ? '✅' : '❌') + ' Research complete: <em>' + escHtml(q) + '</em></span>' + (sid ? ('<button onclick="loadPastSession(\'' + sid + '\', \'Research\', \'research\');removeToast(this)">View</button>') : '') + '<button onclick="removeToast(this)">✕</button>';
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 12000);
}

function removeToast(btn) {
  const toast = btn.closest('.bg-task-toast');
  if (toast) toast.remove();
}

function clearChat() { newChat(); }

function newChat() {
  sessionId = null;
  attachedFiles = [];
  currentDocId = null;
  isProcessing = false;
  clearSessionState();
  if (isDeepResearchMode) toggleDeepResearch();
  sessionBadge.classList.add('hidden');
  scannedBanner.style.display = 'none';
  filePreviewList.innerHTML = '';
  messageInput.value = '';
  messageInput.style.height = 'auto';
  messageInput.disabled = true;
  messageInput.placeholder = 'Ask a question, or drag & drop a document here...';
  sendBtn.disabled = true;
  breadcrumbCurrent.textContent = 'New Conversation';
  clearMessages();
  showEmptyState();
  highlightActiveSession(null);
}

async function loadHistory() {
  try {
    const r = await fetch(API_BASE + '/documents/history');
    if (!r.ok) return;
    const d = await r.json();
    renderHistory(d.sessions || []);
  } catch(e) {}
}

function renderHistory(sessions) {
  historyCount.textContent = sessions.length ? sessions.length + ' chats' : '';
  if (!sessions.length) { historyList.innerHTML = '<div class="history-empty">No conversations yet</div>'; return; }
  historyList.innerHTML = sessions.map(function(s) {
    const isR = s.session_type === 'research';
    const icon = isR ? '🔬' : '📄';
    const lbl = isR ? 'Research' : 'Document';
    const run = Object.values(backgroundTasks).some(function(t) { return !t.done && t.ownerSessionId === s.session_id; }) ? '<span class="hi-running"></span>' : '';
    return '<div class="history-item ' + (s.session_id === sessionId ? 'active' : '') + '" id="hi-' + s.session_id + '"><div class="hi-content" onclick="loadPastSession(\'' + s.session_id + '\', \'' + escHtml(s.title) + '\', \'' + (s.session_type || 'document') + '\')"><div class="hi-icon">' + icon + '</div><div class="hi-info"><div class="hi-title">' + escHtml(s.title) + ' ' + run + '</div><div class="hi-meta">' + lbl + ' · ' + s.message_count + ' msg · ' + formatDate(s.updated_at) + '</div></div></div><button class="hi-delete" onclick="deleteSession(event, \'' + s.session_id + '\')">Delete</button></div>';
  }).join('');
}

async function deleteSession(e, sid) {
  e.stopPropagation();
  if (!confirm('Delete this chat?')) return;
  try {
    const r = await fetch(API_BASE + '/documents/history/' + sid, { method: 'DELETE' });
    if (!r.ok) throw new Error('Delete failed');
    clearCachedSources(sid);
    if (sid === sessionId) newChat();
    loadHistory();
  } catch(err) { showToast('Delete failed', err.message, 'error'); }
}

async function loadPastSession(sid, title, sessionType) {
  if (sid === sessionId) return;
  try {
    const res = await fetch(API_BASE + '/documents/history/' + sid);
    const data = await res.json();
    if (!res.ok) return;
    sessionId = sid;
    saveSessionState();
    attachedFiles = [];
    renderFilePreviewList();
    clearMessages();
    let sessionFiles = [];
    try {
      const fr = await fetch(API_BASE + '/documents/session/' + sid + '/files');
      if (fr.ok) {
        const fd = await fr.json();
        for (let i = 0; i < (fd.files || []).length; i++) {
          const item = fd.files[i];
          const name = typeof item === 'string' ? item : (item.name || item.file_name);
          const did = typeof item === 'string' ? null : (item.doc_id || item.id || null);
          if (!name) continue;
          sessionFiles.push({ name: name, doc_id: did });
          attachedFiles.push({ name: name, file: null, uploaded: true, doc_id: did });
        }
        renderFilePreviewList();
      }
    } catch(e) {}
    sessionBadge.classList.remove('hidden');
    sessionIdDisp.textContent = sid.slice(0, 8) + '...';
    breadcrumbCurrent.textContent = escHtml(title || 'Conversation');
    messageInput.disabled = false;
    sendBtn.disabled = false;
    const isR = (sessionType || data.session_type || '') === 'research';
    if (isR && !isDeepResearchMode) toggleDeepResearch();
    if (!isR && isDeepResearchMode) toggleDeepResearch();
    messageInput.placeholder = isR ? 'Ask a follow-up research question...' : 'Ask a follow-up question...';
    messageInput.focus();
    const assistantElements = [];
    const seenContent = new Set();
    let hasSuccessfulDoc = false;
    let hasDocUploadAttempt = false;
    const msgs = data.messages || [];
    for (let i = 0; i < msgs.length; i++) {
      const msg = msgs[i];
      const sender = msg.role === 'human' ? 'user' : 'assistant';
      if (sender === 'assistant') {
        const contentKey = (msg.content || '').trim().slice(0, 200);
        if (seenContent.has(contentKey)) { continue; }
        seenContent.add(contentKey);
      }
      const isSummary = msg.is_summary === true ||
        (msg.content || '').includes('Document Brief') ||
        (msg.content || '').includes('Voici un résumé') ||
        (msg.content || '').includes('points principaux') ||
        (msg.content || '').includes('conclusions clés');
      if (isSummary) hasSuccessfulDoc = true;
      if (sender === 'user' && (!msg.content || msg.content.trim().length === 0)) hasDocUploadAttempt = true;
      if (sender === 'assistant' && isGuardrailMessage(msg.content)) {
        const isFailedUpload = hasDocUploadAttempt && !hasSuccessfulDoc && i > 0;
        if (isFailedUpload) { continue; }
        const lang = detectGuardrailLanguage(msg.content);
        const d = document.createElement('div');
        d.className = 'message assistant';
        d.innerHTML = '<div class="message-avatar">AI</div><div class="message-body">' + renderGuardrailCard(lang) + '</div>';
        messages.appendChild(d);
        messages.scrollTop = messages.scrollHeight;
        assistantElements.push({ el: d, msg: msg, index: i });
        continue;
      }
      let sources = msg.sources || (msg.metadata && msg.metadata.sources) || [];
      if (!sources.length && sender === 'assistant') { sources = lookupCachedSources(sid, msg.content); }
      const el = addMessage(msg.content, sender, isSummary, sources);
      if (sender === 'assistant') {
        assistantElements.push({ el: el, msg: msg, index: i });
      }
    }
    let fileIndex = 0;
    for (let i = 0; i < assistantElements.length; i++) {
      const item = assistantElements[i];
      const msg = item.msg;
      const isDocBrief = (msg.content || '').includes('Document Brief') ||
        (msg.content || '').includes('Voici un résumé') ||
        (msg.content || '').includes('Voici un bref résumé') ||
        (msg.content || '').includes('points principaux') ||
        msg.is_summary === true ||
        (msg.metadata && msg.metadata.is_summary === true);
      if (isDocBrief && fileIndex < sessionFiles.length) {
        addDocumentCard(sessionFiles[fileIndex].name, item.el);
        fileIndex++;
      }
    }
    while (fileIndex < sessionFiles.length) {
      addDocumentCard(sessionFiles[fileIndex].name);
      fileIndex++;
    }
    const running = Object.values(backgroundTasks).find(function(t) { return !t.done && t.ownerSessionId === sid; });
    if (running) running.bubble = createResearchBubble('🔬 Research still running...');
    highlightActiveSession(sid);
  } catch(err) {}
}

function highlightActiveSession(sid) {
  document.querySelectorAll('.history-item').forEach(function(el) { el.classList.remove('active'); });
  if (sid) {
    const el = document.getElementById('hi-' + sid);
    if (el) el.classList.add('active');
  }
}

messageInput.addEventListener('input', function() {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
});

messageInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey && !isProcessing) {
    e.preventDefault();
    sendMessage();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'u') { e.preventDefault(); document.getElementById('fileInput').click(); }
  if (e.ctrlKey && e.key === 'd') { e.preventDefault(); toggleDeepResearch(); }
  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); newChat(); }
});

showEmptyState();
loadHistory();
const restoredSid = restoreSessionState();
if (restoredSid) loadPastSession(restoredSid, 'Previous Chat', 'document');
</script>
